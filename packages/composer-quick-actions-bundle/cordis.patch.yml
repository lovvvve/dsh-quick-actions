# The `dsh.bundle.patch` layer of this package.
#
# `dsh plugin --profile web add dsh-composer-quick-actions-bundle` installs this
# package as a profile dependency; because the manifest declares `dsh.bundle`,
# the CLI appends the package to `dsh.profile.bundles`, and profile boot then
# applies this layer over the bundles ahead of it. The single `insert` mounts the
# feature package's Host half; the feature package's own `dsh.client`
# declaration is what makes the web app load its `./client` bundle as the
# browser half. No profile file needs editing by hand.
#
# `id` is the loader entry id and is part of the installed identity: it is what
# `cordis` reports, what a `disabled` expression in a later layer would target,
# and what an aggregate bundle would collide with. Do not rename it.
#
# The plugin takes no required config. To declare additional Preset Quick
# Actions, add a `config.presets` block for the `composer-quick-actions` id in
# the PROFILE's own patch layer — `<DSH_HOME>/profiles/<name>/cordis.patch.yml`,
# which is applied after every bundle layer. Never edit this file in an
# installed `node_modules`: an install replaces it. An invalid preset there
# fails plugin loading loudly rather than shipping a partial catalog. The readme
# has a worked example.
- insert:
    - id: composer-quick-actions
      name: dsh-composer-quick-actions
