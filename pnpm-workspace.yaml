packages:
  - packages/*
  - tools/*

# tsdown/vitest require esbuild's reviewed native binary install step.
allowBuilds:
  esbuild: true

# pnpm 11 holds freshly published versions back by default. The DSH 0.1.7-alpha.2
# line is younger than that hold and this workspace must build against it
# (ticket 31: 0.1.7-alpha.1 rewrote Settings into profile-backed Config forms), so
# each package of that line — and the Cordis release it pins, published the
# same day — is exempted by exact version. Delete this whole
# block once the DSH floor moves to a line old enough to install unaided —
# leaving it in place would keep these exact versions exempt forever.
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis-plugin-group@1.0.4'
  - '@deepseek-ai/cordis-plugin-include@1.0.9'
  - '@deepseek-ai/cordis-plugin-loader@1.0.5'
  - '@deepseek-ai/cordis@4.0.4'
  - '@deepseek-ai/cosmokit@1.8.5'
  - '@deepseek-ai/schemastery@3.18.4'
  - '@deepseek-ai/dsh-app-boot@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-atomic-write@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-brand@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-client-connection@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-client-locale@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-client-ui-conversation@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-client-ui-renderer@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-client-ui-settings@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-config-editor@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-credentials@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-home-paths@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-invariants@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-launch-environment@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-llm@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-package-manifest@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-scope@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-session@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-settings@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-system-prompt@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-timeout@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-typert-protocol@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-util-crypto@0.1.7-alpha.2'
  - '@deepseek-ai/dsh-util-values@0.1.7-alpha.2'

# DSH publishes its packages with peer ranges that pin the whole line
# (`0.1.7-alpha.2`), but its `latest` dist-tag still points at 0.0.1-rc.1, so
# pnpm's auto-installed peers fall back to the previous line and leave the
# dev tree a mix of lines. Pinning the transitive members keeps every DSH
# declaration this workspace typechecks against on one line (tickets 29, 31).
overrides:
  '@deepseek-ai/dsh-invariants': 0.1.7-alpha.2
  '@deepseek-ai/dsh-scope': 0.1.7-alpha.2
  '@deepseek-ai/dsh-session': 0.1.7-alpha.2
